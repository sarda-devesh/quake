syntax = "proto3";

import "google/protobuf/empty.proto";

package coordinator;

service Coordinator {
  // Register a Compute Worker
  rpc RegisterCompute (RegisterComputeRequest) returns (google.protobuf.Empty) { }

  // Register a Storage Worker
  rpc RegisterStorage (RegisterStorageRequest) returns (google.protobuf.Empty) { }

  // Register a new index
  rpc RegisterNewIndex(RegisterIndexRequest) returns (RegisterIndexReply) { }
}

// The request sent by the workers to register themselves with the coordinator
message RegisterComputeRequest { 
  int32 service_port = 1;
}

message RegisterStorageRequest { 
  int32 service_port = 1;
}

// Messages used to register a new index with the coordinator
message RegisterIndexRequest { 
  int32 num_partitions = 1;
}

message RegisterIndexReply { 
  int32 global_index_id = 1;
  repeated uint32 partition_ids = 2;
  repeated string partition_storage_nodes = 3;
}